[project]
name = "llm-rag"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi[standard]>=0.141.1",
    "numpy>=2.4.6",
    "ollama>=0.6.2",
    "openai>=3.14.0",
    "pdfplumber>=0.11.10",
    "requests>=2.34.2",
    "sentence-transformers>=6.0.1",
    "streamlit>=1.64.0",
]
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]